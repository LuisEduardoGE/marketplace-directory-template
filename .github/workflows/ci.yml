name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No package.json or lockfile (zero dependencies), so there is nothing for setup-node to cache.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: make lint
      - name: Test
        run: make test
